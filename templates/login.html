{% extends 'base.html' %}

{% block title %}Giris Yap{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 col-lg-4">
        <div class="card glass-card fade-in">
            <div class="card-header card-header-turuncu text-center">
                <h4 class="mb-0">
                    <i class="bi bi-key-fill me-2"></i>Giris Yap
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/login">
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Kullanici Adi
                        </label>
                        <input type="text"
                               class="form-control form-control-glass"
                               id="username"
                               name="username"
                               placeholder="Kullanici adinizi girin"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock me-1"></i>Sifre
                        </label>
                        <input type="password"
                               class="form-control form-control-glass"
                               id="password"
                               name="password"
                               placeholder="Sifrenizi girin"
                               required>
                    </div>

                    <button type="submit" class="btn btn-turuncu w-100 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Giris Yap
                    </button>
                </form>

                <div class="text-center mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.1);">
                    <p class="mb-0 text-muted">
                        Hesabiniz yok mu?
                        <a href="/register" class="text-turuncu fw-semibold">
                            <i class="bi bi-person-plus me-1"></i>Uye Ol
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-75 {
        min-height: 75vh;
    }
</style>
{% endblock %}
