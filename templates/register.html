{% extends 'base.html' %}

{% block title %}Uye Ol{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card fade-in">
            <div class="card-header card-header-turuncu text-center">
                <h4 class="mb-0">
                    <i class="bi bi-person-plus-fill me-2"></i>Uye Ol
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/register">
                    <div class="mb-4">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Kullanici Adi
                        </label>
                        <input type="text"
                               class="form-control form-control-glass"
                               id="username"
                               name="username"
                               placeholder="Benzersiz bir kullanici adi secin"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-1"></i>Email
                        </label>
                        <input type="email"
                               class="form-control form-control-glass"
                               id="email"
                               name="email"
                               placeholder="email@ornek.com"
                               required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i>Sifre
                            </label>
                            <input type="password"
                                   class="form-control form-control-glass"
                                   id="password"
                                   name="password"
                                   placeholder="Guclu bir sifre"
                                   required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label for="password_confirm" class="form-label">
                                <i class="bi bi-lock-fill me-1"></i>Sifre Tekrar
                            </label>
                            <input type="password"
                                   class="form-control form-control-glass"
                                   id="password_confirm"
                                   name="password_confirm"
                                   placeholder="Sifreyi tekrarlayin"
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-turuncu w-100 mb-3">
                        <i class="bi bi-check-circle me-2"></i>Hesap Olustur
                    </button>
                </form>

                <div class="text-center mt-4 pt-3" style="border-top: 1px solid rgba(255,255,255,0.1);">
                    <p class="mb-0 text-muted">
                        Zaten uye misiniz?
                        <a href="/login" class="text-turuncu fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Giris Yap
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-75 {
        min-height: 75vh;
    }
</style>
{% endblock %}
