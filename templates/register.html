{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-5">
            <div class="d-inline-flex align-items-center justify-content-center mb-4" style="width: 72px; height: 72px; background: var(--gradient-1); border-radius: 18px; font-size: 1.75rem;">
                🚀
            </div>
            <h1 style="font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem;">Hesap Oluştur</h1>
            <p class="text-secondary">Görevlerini organize etmeye başla</p>
        </div>
        
        <div class="card glass-card">
            <div class="card-body p-4">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert" style="background: rgba(254, 202, 87, 0.1); border-color: var(--warning); color: var(--warning);">
                            <i class="bi bi-exclamation-triangle me-2"></i>{{ messages[0] }}
                        </div>
                    {% endif %}
                {% endwith %}
                
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">Kullanıcı Adı</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" name="username" class="form-control py-3" placeholder="Bir kullanıcı adı seç" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Şifre</label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-shield-lock input-icon"></i>
                            <input type="password" name="password" class="form-control py-3" placeholder="Güçlü bir şifre oluştur" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 mb-4">
                        <i class="bi bi-person-plus me-2"></i>Kayıt Ol
                    </button>
                </form>
                
                <div class="text-center">
                    <span class="text-muted">Zaten hesabın var mı?</span>
                    <a href="/login" style="font-weight: 600; margin-left: 0.5rem;">Giriş Yap</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
