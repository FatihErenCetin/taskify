<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Görev Yöneticisi{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Kendi CSS'imiz (Bootstrap'ten sonra - override için) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📋 Görev Yöneticisi</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠 Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tasks">📋 Görevler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add">➕ Yeni Görev</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/aboutme">👤 Hakkımda</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- İÇERİK -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="container mt-5 pt-4 border-top text-center text-muted">
        <p>© 2026 Akıllı Görev Yöneticisi | Flask + Bootstrap ile yapıldı 🐍</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
