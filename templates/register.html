{% extends 'base.html' %}

{% block title %}Üye Ol{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header card-header-turuncu">
                <h4 class="mb-0">📝 Üye Ol</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label for="username" class="form-label">Kullanıcı Adı:</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Şifre:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password2" class="form-label">Şifre Tekrar:</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                    
                    <button type="submit" class="btn btn-turuncu w-100">Üye Ol</button>
                </form>
                
                <hr>
                <p class="text-center mb-0">Zaten üye misiniz? <a href="/login">Giriş Yap</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
